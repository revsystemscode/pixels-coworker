name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Las pruebas de la API usan una base de datos real (pixels_test, la crean ellas).
      - run: docker compose up -d --wait postgres
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pixels/web exec playwright install --with-deps chromium
      # Postgres (cuentas y espacios), Redis (avisos al servidor de juego), Mailpit (correos de login)
      # y LiveKit (video). Playwright arranca la web, la API y el servidor de juego.
      - run: docker compose up -d --wait postgres redis mailpit livekit
      - run: pnpm db:migrate
      - run: pnpm --filter @pixels/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results/
